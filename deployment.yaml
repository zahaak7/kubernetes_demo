apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-service
  labels:
    app: car-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-service
  template:
    metadata:
      labels:
        app: car-service
    spec:
      containers:
      - name: car-service
        image: zahaak7/car-service:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: car-service-svc
  labels:
    app: car-service
spec:
  type: NodePort
  selector:
    app: car-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30008
